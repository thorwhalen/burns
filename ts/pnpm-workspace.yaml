# The published package is the workspace root (kenburnz); `demo/` is the
# browser-verification harness (never published — kenburnz's files: [dist]
# excludes it). Listing it here lets pnpm manage its dev deps (vite).
packages:
  - demo

# Allow esbuild (vitest/tsup's transform engine) to run its postinstall, which
# fetches the platform-native binary. Without this, pnpm 11 reports
# ERR_PNPM_IGNORED_BUILDS and `pnpm test` / `pnpm build` exit non-zero.
allowBuilds:
  esbuild: true
