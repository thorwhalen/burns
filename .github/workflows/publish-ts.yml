# Publish the co-located TypeScript package `kenburnz` (ts/) to npm.
#
# This is SEPARATE from ci.yml (the wads/PyPI Python CI, which knows nothing
# about ts/). Publishing is irreversible — a version number can never be reused —
# so this workflow is *manual by intent* and **dry-runs by default**.
#
# ── How to release ────────────────────────────────────────────────────────
#   1. Bump  ts/package.json  "version"  (e.g. `cd ts && npm version patch
#      --no-git-tag-version`), commit, and merge to main.
#   2. Actions → "Publish kenburnz (npm)" → Run workflow.
#      Leave  dry_run = true  first: it builds + `npm publish --dry-run` so you
#      can read the file list and the resolved version with zero risk.
#   3. Re-run with  dry_run = false  to actually publish.
#   Or: push a tag `kenburnz-v<version>` (must equal package.json) to publish
#   non-dry directly.
#
# ── Auth: OIDC Trusted Publishing (durable) + token bootstrap ──────────────
# The ecosystem's agreed direction is npm **Trusted Publishing** (OIDC): no
# stored token, no rotation, ever. This workflow already grants
# `id-token: write` and uses npm ≥ 11.5.1, so once you configure a trusted
# publisher for `kenburnz` on npmjs.com (Package → Settings → Trusted Publisher:
# repo `thorwhalen/burns`, workflow `publish-ts.yml`), publishes are tokenless
# and carry provenance.
#
# BOOTSTRAP CAVEAT: npm has no PyPI-style "pending publisher", so a *brand-new*
# package can't be configured for trusted publishing until it exists. The very
# first publish therefore falls back to `NODE_AUTH_TOKEN` (the `NPM_TOKEN`
# secret). Before that first run, verify the token is valid and not the
# stale value the central secrets-sync may have pushed:
#   curl -s -H "Authorization: Bearer $NPM_TOKEN" \
#        https://registry.npmjs.org/-/whoami     # → {"username":"thorwhalen1"}
# After the first publish, set up the trusted publisher and the token becomes
# unnecessary (leave it as a harmless fallback).
name: Publish kenburnz (npm)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build + npm publish --dry-run, no upload)"
        type: boolean
        default: true
  push:
    tags:
      - "kenburnz-v*"

# Trusted Publishing needs an OIDC token; provenance needs id-token + contents.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing + provenance require npm ≥ 11.5.1 (Node 22 ships 10.x).
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build + unit tests
        run: |
          pnpm build
          pnpm test

      # Tag-triggered runs: the tag must match the package version, else we'd
      # publish a surprise version.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/kenburnz-v')
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#kenburnz-v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME != package.json version $pkg_version"
            exit 1
          fi

      # Refuse to clobber: a version already on npm cannot be republished.
      - name: Guard against an already-published version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if npm view "kenburnz@${pkg_version}" version >/dev/null 2>&1; then
            echo "::error::kenburnz@${pkg_version} is already on npm. Bump the version."
            exit 1
          fi
          echo "kenburnz@${pkg_version} is publishable."

      - name: Publish (dry run)
        # Default for workflow_dispatch; tag pushes always do a real publish.
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (real)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
