# npm auth: trusted publishing (OIDC) only. Never add an NPM_TOKEN secret.
# npmjs.com -> each package -> Settings -> Trusted Publisher -> GitHub Actions:
#   owner/repo = thorwhalen/burns, workflow filename = npm-ci.yml, no environment.
# wads NPM CI — calls the reusable workflow hosted in i2mint/wads.
#
# All configuration lives in ts/package.json under the "wads" key (wads.ci.*).
# This workflow only runs when the JS/TS subdirectory changes, so it never
# collides with the Python ci.yml.
#
# Publishing to npm is OPT-IN: wads.ci.publish.enabled is true here, so a push
# to the default branch (main) whose commit message contains "[publish-npm]"
# publishes kenburnz. Publishing uses OIDC trusted publishing by default
# (configure the trusted publisher for this repo + workflow filename on
# npmjs.com). The first publish of a new name must be done locally.
name: NPM CI
on:
  push:
    paths:
      - "ts/**"
      - ".github/workflows/npm-ci.yml"
  pull_request:
    paths:
      - "ts/**"
jobs:
  npm-ci:
    uses: i2mint/wads/.github/workflows/npm-ci.yml@master
    permissions:
      contents: read
      id-token: write # npm provenance / OIDC trusted publishing
    with:
      package-dir: ts
